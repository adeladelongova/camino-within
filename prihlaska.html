<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Přihláška — Forever Camino</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #b8960c;
    --gold-lt: #e8d48a;
    --teal: #2a5a6b;
    --cream: #faf7f2;
    --muted: #888;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Montserrat', sans-serif;
  }
  body {
    font-family: var(--sans);
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .logo {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 300;
    color: var(--teal);
    letter-spacing: 0.1em;
    margin-bottom: 48px;
  }
  .gold-line {
    width: 48px;
    height: 2px;
    background: var(--gold);
    margin: 32px auto;
  }
  h1 {
    font-family: var(--serif);
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 300;
    color: var(--teal);
    line-height: 1.2;
  }
  h1 em {
    font-style: italic;
    color: var(--gold);
  }
  p {
    font-size: 14px;
    color: var(--muted);
    margin-top: 16px;
    line-height: 1.8;
  }
  .back-link {
    margin-top: 48px;
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--teal);
    text-decoration: none;
    border-bottom: 1px solid var(--gold-lt);
    padding-bottom: 4px;
  }
</style>
</head>
<body>
  <div class="logo">Camino Within</div>
  <h1>Přihláška se<br><em>připravuje</em></h1>
  <div class="gold-line"></div>
  <p>Brzy zde najdete přihlašovací formulář.<br>Mezitím nás neváhejte kontaktovat přímo.</p>
  <a class="back-link" href="index.html">← Zpět na brožuru</a>
</body>
</html>
